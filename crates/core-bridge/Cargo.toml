[package]
name = "herdr-hub-core-bridge"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "io-std", "process", "rt-multi-thread", "macros", "time", "signal", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
serde_json = "1"

[[bin]]
name = "herdr-hub-agent"
path = "src/main.rs"

[[bin]]
name = "herdr-hub-test-hc"
path = "tests/fixtures/hc.rs"
test = false
bench = false
doc = false
